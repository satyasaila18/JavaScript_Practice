<!DOCTYPE html>
<html>
<head>
    <title>Age Category</title>
    <style>
        body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#333;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    text-align:left;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:5px;
    background:#007bff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

p{
    font-size:18px;
    color:#444;
}

#result,
#output,
#demo{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:green;
}
    </style>
</head>
<body>
<div class="container">
<label>Enter Age:</label>
<input type="number" id="age">
<button onclick="checkAge()">Check</button>

<h3 id="result"></h3>
</div>
<script>
function checkAge() {

    let age = Number(document.getElementById("age").value);

    if(age < 13)
        document.getElementById("result").innerHTML = "Child";
    else if(age >= 13 && age <= 19)
        document.getElementById("result").innerHTML = "Teenager";
    else if(age >= 20 && age <= 59)
        document.getElementById("result").innerHTML = "Adult";
    else
        document.getElementById("result").innerHTML = "Senior Citizen";

}
</script>

</body>
</html>
