<!DOCTYPE html>
<html>
<head>
    <title>Grocery Item</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            box-sizing:border-box;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        #result{
            margin-top:20px;
            color:blue;
            font-size:18px;
        }

    </style>

</head>
<body>

<div class="container">

<h2>Grocery Bill</h2>

<input type="text" id="item" placeholder="Item Name">

<input type="number" id="qty" placeholder="Quantity">

<input type="number" id="price" placeholder="Price Per Item">

<button onclick="bill()">Calculate</button>

<div id="result"></div>

</div>

<script>

function bill(){

    let grocery={

        itemName:document.getElementById("item").value,
        quantity:Number(document.getElementById("qty").value),
        pricePerItem:Number(document.getElementById("price").value)

    };

    let total=grocery.quantity*grocery.pricePerItem;

    document.getElementById("result").innerHTML=

    "Item Name : "+grocery.itemName+"<br><br>"+
    "Quantity : "+grocery.quantity+"<br>"+
    "Price Per Item : ₹"+grocery.pricePerItem+"<br>"+
    "<b>Total Price : ₹"+total+"</b>";

}

</script>

</body>
</html>
