<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            height: 300px;
            width: 300px;
            background-color: aquamarine;
            border: none;
            border-radius: 20px;
            display: flex   ;
            flex-direction: column;
            align-items: center;
        }
        label{
            font-weight: bolder;
            text-align: left;
        }
        button{
            height: 25px;
            border: none;
            border-radius: 8px;
            background-color: bisque;
            box-shadow: 0px 0px 3px 0px red;
            
        }
        button:hover{
        transform: scaleX(1.5x);
        transform:scaleY(1.5x)
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Strength Checker</h1>
        <label>Password</label>
        <input type="password" id="pwd" placeholder="enter passsword">
        <br><br>
        <button type="button" onclick="check()">Check Strength</button>
        <h3 id="disp"></h3>
    </div>
    <script>
        function check(){
            let pwd=document.getElementById('pwd').value
            let href=document.getElementById('disp')

            if(pwd!=="" && pwd.length<8){
                href.textContent="Password is Weak"
            }
            else if((pwd.includes('a-z')  || pwd.includes('A-Z')) && pwd.includes('1-0')){
                href.textContent="Password is Medium"

            }
            else if(pwd===""){

                href.textContent="Password is Strong"
            }
    
        }

    </script>
</body>
</html>
