<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>
    <style>
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: aliceblue;
}
.container{
    width: 350px;
    padding: 20px;
    background-color: aquamarine;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
h1{
    font-size: 24px;
    text-align: center;
}
label{
    font-weight: bold;
    align-self: flex-start;
    margin-left: 20px;
}
input{
    width: 90%;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid gray;
    outline: none;
}
#disp{
    font-weight: bold;
    text-align: center;
}
        button{
            height: 25px;
            border: none;
            border-radius: 8px;
            background-color: bisque;
            box-shadow: 0px 0px 3px 0px red;
            
        }
        button:hover{
        transform: scaleX(1.5x);
        transform:scaleY(1.5x)
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Strength Checker</h1>
        <label>Password</label>
        <input type="password" id="pwd" placeholder="enter passsword">
        <br><br>
        <button type="button" onclick="check()">Check Strength</button>
        <h3 id="disp"></h3>
    </div>
    <script>
function check() {
    let pwd = document.getElementById("pwd").value;
    let href = document.getElementById("disp");

    let hasLower = /[a-z]/.test(pwd);
    let hasUpper = /[A-Z]/.test(pwd);
    let hasNumber = /[0-9]/.test(pwd);

    if (pwd === "") {
        href.textContent = "Please enter a password";
    }
    else if (pwd.length < 8) {
        href.textContent = "Password is Weak";
    }
    else if (hasUpper && hasLower && hasNumber) {
        href.textContent = "Password is Strong";
    }
    else if ((hasLower || hasUpper) && hasNumber) {
        href.textContent = "Password is Medium";
    }
    else {
        href.textContent = "Password is Weak";
    }
}

    </script>
</body>
</html>
