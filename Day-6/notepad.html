<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    padding:40px;
}

.container{
    width:700px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:none;
    height:120px;
}

button{
    padding:10px 20px;
    border:none;
    background:#2196F3;
    color:white;
    cursor:pointer;
    border-radius:5px;
    margin-right:10px;
    transition:.3s;
}

button:hover{
    background:#0b7dda;
}

.note{
    margin-top:15px;
    padding:15px;
    border-left:5px solid #2196F3;
    background:#f9f9f9;
    border-radius:5px;
}

.note h3{
    margin-bottom:8px;
}

.actions{
    margin-top:10px;
}

.edit{
    background:orange;
}

.delete{
    background:red;
}

.edit:hover{
    background:darkorange;
}

.delete:hover{
    background:darkred;
}

</style>

</head>
<body>

<div class="container">

<h1> Notes Application</h1>

<input
type="text"
id="search"
placeholder="Search Notes..."
onkeyup="searchNotes()">

<input
type="text"
id="title"
placeholder="Enter Title">

<textarea
id="note"
placeholder="Write your note..."></textarea>

<button onclick="saveNote()">
Save Note
</button>

<div id="notes"></div>

</div>

<script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];

let editIndex = -1;

displayNotes();

function saveNote(){

    let title=document.getElementById("title").value.trim();

    let note=document.getElementById("note").value.trim();

    if(title=="" || note==""){
        alert("Please enter title and note.");
        return;
    }

    if(editIndex==-1){

        notes.push({
            title:title,
            note:note
        });

    }
    else{

        notes[editIndex].title=title;
        notes[editIndex].note=note;

        editIndex=-1;

    }

    localStorage.setItem("notes",JSON.stringify(notes));

    document.getElementById("title").value="";
    document.getElementById("note").value="";

    displayNotes();

}

function displayNotes(){

    let output="";

    notes.forEach((item,index)=>{

        output+=`

        <div class="note">

        <h3>${item.title}</h3>

        <p>${item.note}</p>

        <div class="actions">

        <button class="edit"
        onclick="editNote(${index})">
        Edit
        </button>

        <button class="delete"
        onclick="deleteNote(${index})">
        Delete
        </button>

        </div>

        </div>

        `;

    });

    document.getElementById("notes").innerHTML=output;

}

function editNote(index){

    document.getElementById("title").value=notes[index].title;

    document.getElementById("note").value=notes[index].note;

    editIndex=index;

}

function deleteNote(index){

    if(confirm("Delete this note?")){

        notes.splice(index,1);

        localStorage.setItem("notes",JSON.stringify(notes));

        displayNotes();

    }

}

function searchNotes(){

    let text=document.getElementById("search").value.toLowerCase();

    let output="";

    notes.forEach((item,index)=>{

        if(
            item.title.toLowerCase().includes(text)
            ||
            item.note.toLowerCase().includes(text)
        ){

            output+=`

            <div class="note">

            <h3>${item.title}</h3>

            <p>${item.note}</p>

            <div class="actions">

            <button class="edit"
            onclick="editNote(${index})">
            Edit
            </button>

            <button class="delete"
            onclick="deleteNote(${index})">
            Delete
            </button>

            </div>

            </div>

            `;

        }

    });

    document.getElementById("notes").innerHTML=output;

}

</script>

</body>
</html>
