<!DOCTYPE html>
<html>
<head>
<title>Timer</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;

    }
    .container{
        height: 300px;
        width: 300px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: aqua;
        border-radius: 8px;
    }
    button{
        height: 55px;
        margin: auto;
        border: none;
        border-radius: 5px;
        background-color: burlywood;
    }
</style>

<body>

<div class="container">

<h1 id="timer">30</h1>
<h3 id="tim"></h3>

<button onclick="startTimer()">
Start Timer
</button>

</div>

<script>

let time=30;

function startTimer(){

let ref=document.getElementById("timer");

let interval=setInterval(function(){

ref.innerHTML=time;
document.getElementById('tim').textContent="Timer Started!!!"

time--;

if(time<0){

clearInterval(interval);

ref.innerHTML="Time's Up!";
document.getElementById('tim').remove()

}

},1000);

}

</script>

</body>
</html>
